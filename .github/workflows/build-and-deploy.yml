name: build-and-deploy

# 省资源的取舍：
#   - 只在相关路径变化时构建（改文档、改 README 不触发）
#   - 同分支并发运行时自动取消旧任务
#   - 单架构 linux/amd64（不用 QEMU）、关闭 provenance/sbom
#   - 层缓存走 GitHub Actions cache，二次构建基本秒级
#   - 部署只在手动触发时执行（推送只产镜像），避免误上线
on:
  push:
    branches: [main]
    paths:
      - 'pb_migrations/**'
      - 'pb_hooks/**'
      - 'miniapp/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建后是否部署到服务器'
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 类型检查（快，与 build 并行；H5 构建本身不做类型检查，这一关不能省）
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('miniapp/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 安装依赖
        working-directory: miniapp
        run: bun install --frozen-lockfile

      - name: TypeScript 检查
        working-directory: miniapp
        run: npx tsc --noEmit -p tsconfig.json

  # ---------------------------------------------------------------------------
  # 构建并推送镜像（后端 + 前端产物打进同一个镜像）
  # ---------------------------------------------------------------------------
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名与标签
        id: vars
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: 输出结果
        run: echo "镜像 ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"

  # ---------------------------------------------------------------------------
  # 部署到服务器：上传 compose + 部署脚本，再由脚本完成
  # 备份 → 切换 → 健康检查 → 失败自动回滚
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 上传 compose 与脚本
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.yml docker/deploy.sh docker/backup.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/carehaven/"

      - name: 服务器 GHCR 登录（拉取私有镜像）
        # 服务器上那份 docker 凭据会过期（2026-10-15 实测已失效且影响范围波及既有项目），
        # 因此每次部署都由流水线重新登录，不让部署依赖服务器上的历史残留状态。
        run: |
          printf '%s' "${{ secrets.GHCR_TOKEN }}" | \
            ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: 执行部署
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /srv/carehaven && IMAGE='${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}' REQUIRE_BACKUP=1 bash deploy.sh"
